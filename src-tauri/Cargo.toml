[package]
name = "OpenConv"
version = "0.1.0"
description = "A premium native desktop wrapper frontend studio for FFmpeg"
edition = "2021"

# Tells Rust where the main compilation starting block is located
[[bin]]
name = "OpenConv"
path = "src/main.rs"

[dependencies]
# The core Tauri engine infrastructure layout framework
tauri = { version = "1.8", features = ["dialog-open", "shell-open"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
# All FFmpeg / path / progress logic; lives in its own crate so it can be
# tested without the Tauri system libraries.
openconv-core = { path = "core" }

[build-dependencies]
# Compiles the background system settings hooks on build runtime execution
tauri-build = { version = "1.5", features = [] }

[workspace]
members = ["core"]

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
