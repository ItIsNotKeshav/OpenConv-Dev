name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend lint & tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test

  core:
    name: Rust core tests (with FFmpeg)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Format
        working-directory: src-tauri
        run: cargo fmt --all --check
      - name: Clippy (core)
        working-directory: src-tauri
        run: cargo clippy -p openconv-core --all-targets -- -D warnings
      - name: Test
        working-directory: src-tauri
        env:
          OPENCONV_REQUIRE_FFMPEG: "1"
        run: cargo test -p openconv-core

  app:
    name: Tauri app check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Tauri 1 needs webkit2gtk-4.0, which Ubuntu 22.04 still ships.
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.0-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Clippy (whole workspace)
        working-directory: src-tauri
        run: cargo clippy --workspace --all-targets -- -D warnings
